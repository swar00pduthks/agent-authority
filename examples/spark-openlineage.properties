# Send Spark lineage to Agent Authority over HTTP (same endpoint as Marquez)
spark.extraListeners=io.openlineage.spark.agent.OpenLineageSparkListener
spark.openlineage.transport.type=http
spark.openlineage.transport.url=http://localhost:8000
spark.openlineage.namespace=spark-prod

# At volume, use Kafka instead and run `authority collect`:
# spark.openlineage.transport.type=kafka
# spark.openlineage.transport.topicName=openlineage.events
# spark.openlineage.transport.properties.bootstrap.servers=localhost:29092
