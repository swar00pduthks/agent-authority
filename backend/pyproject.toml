[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub"
version = "0.1.0"
description = "OpenLineage-native lineage and governance hub for data pipelines and AI agents"
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.7"]
postgres = ["psycopg[binary]>=3.1"]
kafka = ["confluent-kafka>=2.3"]
prod = ["clickhouse-connect>=0.7", "psycopg[binary]>=3.1", "confluent-kafka>=2.3"]
dev = ["pytest>=8", "httpx>=0.27", "chdb>=2.0", "psycopg[binary]>=3.1", "ruff>=0.4"]

[project.scripts]
agenthub = "agenthub.cli:main"
agenthub-api = "agenthub.api.main:run"
agenthub-collector = "agenthub.collector.kafka_consumer:main"

[tool.setuptools.packages.find]
include = ["agenthub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
