[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-authority"
version = "0.1.0"
description = "OpenLineage-native lineage and governance hub for data pipelines and AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.7"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
kafka = ["confluent-kafka>=2.3"]
prod = ["clickhouse-connect>=0.7", "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "confluent-kafka>=2.3"]
dev = ["pytest>=8", "httpx>=0.27", "chdb>=2.0", "psycopg[binary]>=3.1", "ruff>=0.4"]

[project.scripts]
authority = "agent_authority.cli:main"
authority-api = "agent_authority.api.main:run"
authority-collector = "agent_authority.collector.kafka_consumer:main"

[tool.setuptools.packages.find]
include = ["agent_authority*"]

[tool.setuptools.package-data]
agent_authority = ["static/**/*", "static/*", "storage/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
