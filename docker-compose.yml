# Full production-shaped stack on one machine:
#   docker compose up -d                    # Kafka, ClickHouse, Postgres, collector, API + UI
#   docker compose --profile demo up -d     # ...plus live demo traffic through Kafka
# UI and API: http://localhost:8000      Kafka for your emitters: localhost:29092

x-hub-env: &hub-env
  AUTHORITY_STORE: prod
  AUTHORITY_POLICY: /etc/agent_authority/policy.yaml
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_USER: authority
  CLICKHOUSE_PASSWORD: authority
  POSTGRES_DSN: postgresql://authority:authority@postgres:5432/authority
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_TOPIC: openlineage.events

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    ports: ["29092:29092"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: authority
      CLICKHOUSE_PASSWORD: authority
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    volumes: [clickhouse:/var/lib/clickhouse]
    ports: ["8123:8123"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authority
      POSTGRES_PASSWORD: authority
      POSTGRES_DB: authority
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authority"]
      interval: 5s
      retries: 20

  api:
    build: .
    image: agent-authority:local
    environment: *hub-env
    volumes: [./deploy/policy.yaml:/etc/agent_authority/policy.yaml:ro]
    ports: ["8000:8000"]
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }

  collector:
    image: agent-authority:local
    command: ["authority", "collect"]
    environment: *hub-env
    volumes: [./deploy/policy.yaml:/etc/agent_authority/policy.yaml:ro]
    depends_on:
      api: { condition: service_healthy }
      kafka: { condition: service_started }
    restart: unless-stopped

  demo-traffic:
    image: agent-authority:local
    profiles: [demo]
    command: ["authority", "seed", "--kafka", "kafka:9092", "--count", "60", "--follow"]
    depends_on: [collector]
    restart: unless-stopped

volumes:
  clickhouse:
  postgres:
